project: ІС «Ресторан (тестова дефектна специфікація)»

system_request:
  sponsor: Олександр Коваленко
  business_need: Автоматизація ресторану.
  business_requirements:
    - Бронювання столиків.
  business_value:
    - Скорочення часу очікування на 30%.
  constraints:
    - Термін 3 місяці.

stakeholders:
  - Гість
  - Офіціант

user_stories:
  - id: US-01
    text: Як гість, я хочу бронювати столик.
  - id: US-99
    text: Як офіціант, я хочу бачити премії (ця історія навмисно ніде не прив'язана).

requirements:
  # Базова коректна вимога для перевірки дублікатів
  - id: R1
    type: functional
    text: ІС повинна відображати інтерактивну карту залу на 25 столиків для створення бронювань.
    priority: 1
    source: US-01

  # Порушення: не починається з "ІС повинна", розмите слово "зручн", пріоритет 9, неіснуючий батько R3
  - id: R2.1
    parent: R3
    type: functional
    text: Адміністратору надається зручний інтерфейс для розсадки гостей у залі.
    priority: 9
    source: US-01

  # Порушення: надлишковість (схожа на R1 >= 85%) + деталь реалізації ("кнопка", "MySQL")
  - id: R2
    type: functional
    text: ІС повинна відображати інтерактивну карту залу на 25 столиків для створення бронювань.
    priority: 2
    source: US-01

  # Порушення: дублікат ID R1 + заборонені слова реалізації ("кнопка", "таблиця", "MySQL")
  - id: R1
    type: functional
    text: ІС повинна мати червону кнопку для збереження замовлення у таблицю бази MySQL.
    priority: 1
    source: US-01

  # Порушення: неправильний шаблон ID (REQ-55) та невідомий тип вимоги (usability)
  - id: REQ-55
    type: usability
    text: ІС повинна відкривати меню замовлень за 1 дотик.
    priority: 2
    source: US-01

  # Порушення: вимога продуктивності (performance) без жодного числового критерію + розмите слово "швидко"
  - id: N1
    type: performance
    text: ІС повинна передавати замовлення на екран кухні дуже швидко.
    priority: 1
    source: US-01

  # Порушення: обмеження (constraint) має встановлений пріоритет
  - id: C1
    type: constraint
    text: ІС повинна працювати через стандартний веббраузер на планшетах діагоналлю від 10 дюймів.
    priority: 3
    source: системний запит
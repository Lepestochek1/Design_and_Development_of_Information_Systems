project: ІС «Ресторан – бронювання столиків, замовлення страв, кухонні черги»

system_request:
  sponsor: Олександр Коваленко, власник та керуючий рестораном «Смак та Затишок»
  business_need: >
    Усунення операційних втрат через ручне управління бронюванням столиків та паперовий
    документообіг між залом і кухнею, підвищення швидкості обслуговування гостей у пікові
    години та збільшення оборотності посадкових місць.
  business_requirements:
    - Онлайн- та офлайн-бронювання столиків через інтерактивну карту залу із контролем перетинів у часі.
    - Мобільний прийом замовлень офіціантами з підтримкою модифікаторів страв, курсів подачі та стоп-листа.
    - Керування кухонними чергами (KDS) з розподілом замовлень по цехах, таймерами та сповіщенням офіціантів.
    - Збір базової аналітики щодо середнього часу приготування страв та завантаженості столиків.
  business_value:
    - Скорочення середнього часу очікування страв у пікові години з 40 до 25 хвилин (на 37,5%).
    - Зменшення частки неявок за бронюванням (no-show) з 18% до 5%, що збільшить оборотність столиків на 15%.
    - Зменшення кількості помилково приготованих страв на 90% (економія близько 15 000 грн на місяць).
    - Підвищення лояльності гостей та зниження рівня конфліктів між офіціантами і кухарями.
  constraints:
    - Розробка та запуск базової версії (MVP) мають бути завершені протягом 3 місяців.
    - Робота інтерфейсів залу та кухні в локальній мережі при тимчасовому зникненні зовнішнього інтернету.
    - Час на навчання лінійного персоналу роботі з інтерфейсом не повинен перевищувати 2 годин.

stakeholders:
  - Гість (Клієнт ресторану)
  - Адміністратор залу (Хостес)
  - Офіціант
  - Кухар / Шеф-кухар
  - Власник / Керуючий рестораном

user_stories:
  - id: US-01
    text: >
      Як гість, я хочу бачити на сайті схему залу з вільними столиками на потрібну дату й час,
      щоб самостійно обрати та забронювати зручне місце без телефонних розмов.
  - id: US-02
    text: >
      Як гість, я хочу отримати повідомлення у Telegram або SMS із деталями бронювання та посиланням
      для скасування, щоб мати підтвердження візиту та попередити заклад у разі зміни планів.
  - id: US-03
    text: >
      Як адміністратор залу, я хочу бачити таймер запізнення гостя за заброньованим столиком понад
      15 хвилин, щоб зв’язатися з клієнтом або віддати столик гостям із живої черги.
  - id: US-04
    text: >
      Як адміністратор залу, я хочу змінювати статус столика на планшеті в один дотик, щоб уся
      зміна бачила реальну картину заповненості залу.
  - id: US-05
    text: >
      Як офіціант, я хочу формувати замовлення на планшеті з поділом за курсами подачі та примітками
      про алергени, щоб кухарі одразу отримали точні деталі приготування.
  - id: US-06
    text: >
      Як офіціант, я хочу отримувати сповіщення на планшет, коли кухар відмічає страву як готову,
      щоб одразу забрати її з роздачі гарячою.
  - id: US-07
    text: >
      Як кухар, я хочу бачити на екрані свого цеху список замовлень із кольоровим підсвічуванням часу
      очікування, щоб готувати страви за пріоритетом і не допускати затримок.
  - id: US-08
    text: >
      Як кухар, я хочу мати кнопку додавання страви у стоп-лист на кухонному екрані, щоб офіціанти
      миттєво бачили її недоступність і не приймали замовлення.

requirements:
  - id: R1
    type: functional
    text: >
      ІС повинна надавати інтерактивну карту залу на 25 столиків для створення бронювань із зазначенням
      дати, часу, кількості гостей та контактного номера телефону.
    priority: 1
    source: US-01

  - id: R1.1
    parent: R1
    type: functional
    text: >
      ІС повинна блокувати можливість створення нового бронювання на столик, якщо обраний часовий
      інтервал у межах 2 годин перетинається з існуючим активним бронюванням цього столика.
    priority: 1
    source: інтерв'ю з керуючим рестораном

  - id: R1.2
    parent: R1
    type: functional
    text: >
      ІС повинна надсилати гостю повідомлення через SMS або Telegram із кодом бронювання та
      посиланням для скасування протягом 30 секунд після оформлення заявки.
    priority: 2
    source: US-02

  - id: R2
    type: functional
    text: >
      ІС повинна підсвічувати заброньований столик на екрані адміністратора попереджувальним
      індикатором, якщо гість не прибув протягом 15 хвилин після призначеного часу бронювання.
    priority: 2
    source: US-03, US-04

  - id: R3
    type: functional
    text: >
      ІС повинна дозволяти офіціанту створювати замовлення, прив'язане до номера столика, та
      обирати страви з електронного каталогу меню.
    priority: 1
    source: US-05

  - id: R3.1
    parent: R3
    type: functional
    text: >
      ІС повинна дозволяти офіціанту вказувати для кожної позиції замовлення номер курсу подачі
      (від 1 до 3) та додавати модифікатори приготування і попередження про алергени.
    priority: 1
    source: US-05

  - id: R3.2
    parent: R3
    type: functional
    text: >
      ІС повинна блокувати додавання страви до замовлення клієнта, якщо кухар вніс цю позицію
      до активного стоп-листа.
    priority: 1
    source: US-08

  - id: R4
    type: functional
    text: >
      ІС повинна автоматично розподіляти позиції підтвердженого замовлення між екранами відповідних
      підрозділів (гарячий цех, холодний цех, бар) відповідно до категорії кожної страви.
    priority: 1
    source: інтерв'ю з керуючим рестораном

  - id: R5
    type: functional
    text: >
      ІС повинна відображати на кухонному екрані (KDS) чергу страв, відсортовану за часом надходження
      замовлення та номером курсу подачі.
    priority: 1
    source: US-07

  - id: R6
    type: functional
    text: >
      ІС повинна змінювати колір картки страви на кухонному екрані на жовтий за 5 хвилин до завершення
      нормативного часу приготування і на червоний у разі перевищення цього нормативу.
    priority: 2
    source: інтерв'ю з керуючим рестораном

  - id: R7
    type: functional
    text: >
      ІС повинна надсилати звукове та візуальне сповіщення на планшет закріпленого офіціанта протягом
      3 секунд після переведення страви кухарем у статус «Готово до видачі».
    priority: 1
    source: US-06

  - id: R8
    type: functional
    text: >
      ІС повинна формувати щоденний звіт для керуючого із показниками середнього часу приготування
      страв та відсотка скасованих бронювань за обраний період.
    priority: 3
    source: системний запит

  - id: N1
    type: performance
    text: >
      ІС повинна забезпечувати передачу нового замовлення з планшета офіціанта на екран кухонного
      цеху (KDS) за час, що не перевищує 2 секунди за умови одночасної роботи до 30 терміналів.
    priority: 1
    source: інтерв'ю з керуючим рестораном

  - id: N2
    type: operational
    text: >
      ІС повинна зберігати працездатність модулів прийому замовлень та кухонних черг у локальній
      мережі закладу при втраті з'єднання із зовнішньою мережею Інтернет.
    priority: 1
    source: системний запит

  - id: N3
    type: security
    text: >
      ІС повинна вимагати авторизацію персоналу за індивідуальним PIN-кодом та обмежувати право
      видалення підтверджених страв із замовлення лише роллю адміністратора залу або керуючого.
    priority: 2
    source: інтерв'ю з керуючим рестораном

  - id: N4
    type: cultural
    text: >
      ІС повинна надавати користувацький інтерфейс для персоналу та гостей українською мовою і
      використовувати грошову одиницю гривня (UAH) для всіх розрахунків.
    priority: 3
    source: регламент роботи закладу

  - id: C1
    type: constraint
    text: >
      ІС повинна бути розроблена та введена в експлуатацію у вигляді базової версії (MVP)
      протягом 3 місяців від дати затвердження технічного завдання.
    source: системний запит

  - id: C2
    type: constraint
    text: >
      ІС повинна підтримувати роботу інтерфейсів офіціанта та кухаря на сенсорних планшетах
      із діагоналлю екрана від 10 дюймів через стандартний веббраузер без встановлення додаткового ПЗ.
    source: інтерв'ю з керуючим рестораном